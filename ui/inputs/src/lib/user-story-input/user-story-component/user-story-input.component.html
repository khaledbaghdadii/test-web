<div class="flex justify-end items-center">
  <mxevolve-add-user-story-modal
    [userStoryIds]="userStoryIds"
    [projectId]="projectId"
    [shouldValidate]="shouldValidate"
    (userStoryAddedEventEmitter)="addUserStory($event)"
  ></mxevolve-add-user-story-modal>
</div>
<p-table [value]="userStoryIds" [paginator]="true" [rows]="5">
  <ng-template pTemplate="header">
    <tr>
      <th pSortableColumn="id" class="w-11/12" scope="col">
        <div class="flex justify-between items-center gap-2">
          <span>ID</span>
          <p-sortIcon field="id"></p-sortIcon>
        </div>
      </th>
      <th scope="col" class="w-1/12"></th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-userStory>
    <tr>
      <td>{{ userStory }}</td>
      <td class="p-1">
        <p-confirmpopup></p-confirmpopup>
        <p-button
          icon="pi pi-trash"
          [rounded]="true"
          [text]="true"
          (onClick)="confirmDelete($event, userStory)"
          severity="danger"
        >
        </p-button>
      </td>
    </tr>
  </ng-template>
  <ng-template pTemplate="emptymessage">
    <tr>
      <td colspan="9" class="py-4">
        <mxflow-table-empty-message></mxflow-table-empty-message>
      </td>
    </tr>
  </ng-template>
</p-table>
