@if (!isLoading) {
<mxevolve-group-dropdown-selection
  [projectId]="projectId"
  [formControl]="selectedGroupFormControl"
  [id]="infraGroupFormControlName"
></mxevolve-group-dropdown-selection>
} @else {
<p-select
  placeholder="Select Infra Group"
  class="w-full"
  [loading]="true"
  [id]="infraGroupFormControlName"
></p-select>
}
