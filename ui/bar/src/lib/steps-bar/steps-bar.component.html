<section class="bg-surface-0 dark:bg-surface-900">
  <ul class="list-none flex gap-4 flex-row justify-between p-0">
    @for (step of steps; track step; let i = $index) {
    <li class="flex items-center flex-col gap-4 relative w-full">
      <div class="flex items-center flex-col gap-4 relative w-full">
        <div
          class="flex justify-center items-center rounded-full bg-primary-100 w-8 h-8 z-10"
        >
          <i class="pi pi-circle-fill text-primary-500"></i>
        </div>
        @if (i !== 0) {
        <div
          class="w-full block absolute right-1/2 bg-primary-500"
          style="transform: translateY(-50%); height: 2px; top: 50%"
        ></div>
        }
      </div>
      <div class="flex flex-col items-center">
        <span class="text-xl text-center">{{ step.name }}</span>
      </div>
    </li>
    }
  </ul>
</section>
