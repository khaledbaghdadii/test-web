@if (!isLoading && !noDataAvailable) {
<div>
  <p-meterGroup [value]="value" labelPosition="end" [max]="total">
    <ng-template #meter let-value let-class="class" let-width="size">
      @if (value.value !== 0) {
      <span
        [pTooltip]="value.label"
        tooltipPosition="top"
        [class]="class"
        [ngClass]="value.color"
        [style]="{ width: width }"
        class="h-6 flex items-center justify-center font-bold text-white"
      >
        {{ value.value }}
      </span>
      }
    </ng-template>
    <ng-template #label>
      <div class="flex flex-wrap gap-4 pt-6">
        @for (meterItem of value; track meterItem; let index = $index) {
        <div class="flex justify-between gap-2">
          <span class="w-4 h-4 rounded-sm" [ngClass]="meterItem.color"></span>
          <div class="flex flex-col gap-1">
            <span class="text-secondary text-sm"
              >{{ meterItem.label }} ({{ meterItem.value }})</span
            >
          </div>
        </div>
        }
      </div>
    </ng-template>
  </p-meterGroup>
</div>
} @if (isLoading) {
<div>
  <p-skeleton height="2rem" styleClass="mb-2"></p-skeleton>
  <div class="flex items-end">
    <p-skeleton width="10rem" styleClass="mr-2"></p-skeleton>
    <p-skeleton width="10rem" styleClass="mr-2"></p-skeleton>
    <p-skeleton width="10rem" styleClass="mr-2"></p-skeleton>
  </div>
</div>
} @if (!isLoading && noDataAvailable) {
<div class="flex flex-col items-center text-gray-400 ng-star-inserted p-4">
  <i class="pi pi-inbox mb-2" style="font-size: 3rem"></i>
  <span>No Data Available</span>
</div>
}
