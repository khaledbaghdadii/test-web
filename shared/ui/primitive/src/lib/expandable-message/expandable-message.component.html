<span class="break-words">{{ displayedMessage() }}</span>
@if (isMessageTruncated()) {
<button
  type="button"
  class="text-primary border-none bg-transparent cursor-pointer text-sm font-semibold p-0 ml-1"
  (click)="showFullMessage()"
  [attr.aria-label]="triggerAriaLabel()"
>
  see more
</button>
}

<p-dialog
  header="Message"
  [modal]="true"
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [closeOnEscape]="true"
  [closable]="true"
  [dismissableMask]="true"
  [style]="{ width: '50rem', 'border-radius': '12px' }"
  [closeButtonProps]="{ outlined: false, text: true, severity: 'secondary' }"
>
  <p
    class="text-sm font-normal text-surface-900 dark:text-surface-0"
    style="line-height: 1.625"
  >
    {{ message() }}
  </p>
</p-dialog>
