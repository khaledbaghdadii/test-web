<mxevolve-business-process-content-container
  header="Build"
  [collapsable]="true"
>
  @for (storyId of storyIds(); track storyId) {
  <a
    headerExtra
    class="ml-4"
    [title]="'View ' + storyId + ' in Jira'"
    [href]="storyId | jiraIssueUrlResolver : jiraBaseUrl()"
    target="_blank"
    rel="noopener noreferrer"
  >
    <p-chip [label]="storyId" />
  </a>
  } @if (environmentId(); as envId) {
  <mxevolve-environment-status-panel
    class="col-span-12"
    [projectId]="projectId()"
    [environmentId]="envId"
    [showOpenConfigEditorAction]="showConfigEditor()"
    [showDeploymentDetails]="false"
  >
    <mxevolve-build-environment-scenario-actions
      repushActions
      [projectId]="projectId()"
      [processId]="processId()"
      [scenarioDetailsDisabled]="scenarioDetailsDisabled()"
      (scenarioRerun)="scenarioRerun.emit()"
    />
  </mxevolve-environment-status-panel>
  } @else if (showEnvironmentWaitingMessage()) {
  <p-message severity="info" class="col-span-12">
    Please wait, we will show you the environment buttons once the deployment
    starts!
  </p-message>
  } @if (development(); as dev) {
  <mxevolve-merge-request-commits
    class="col-span-12"
    [development]="dev"
    [mergeRequest]="mergeRequest()"
    [showCommitsBehindWarning]="true"
  />
  }
</mxevolve-business-process-content-container>
