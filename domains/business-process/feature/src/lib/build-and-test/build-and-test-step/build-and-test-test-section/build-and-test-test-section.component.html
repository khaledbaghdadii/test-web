<mxevolve-business-process-content-container header="Test" [collapsable]="true">
  @if (canRunScenario()) {
  <div class="col-span-12">
    <mxevolve-run-scenario
      [projectId]="projectId()"
      [branchName]="branchName()!"
      [executionGroupId]="executionGroupId()!"
      [machineGroupId]="machineGroupId()"
      [subContextId]="subContextId"
      [warningMessageMap]="warningMessageMap"
      [configurationAudit]="resolveMXConfigurationAuditSettings()"
      (scenarioPushed)="reloadExecution()"
      (errorOccurred)="handleRunScenarioError($event)"
    />
  </div>

  <div
    class="col-span-12 border-t border-surface-200 dark:border-surface-700"
  ></div>
  }

  <div class="col-span-12">
    <h3 class="font-medium mb-2 text-lg">Test Results</h3>
    <mxevolve-scenario-runs
      [projectId]="projectId()"
      [contextId]="processId()"
      [subContextId]="subContextId"
      [warningMessageMap]="warningMessageMap"
      [enableKeepServices]="true"
      [showOpenConfigEditorAction]="true"
      [showHistory]="false"
      [showHistorySummary]="true"
      [hideEnvironmentPanelWhenCleaned]="true"
      [sortPanelsByStartDateDesc]="true"
      [showEnvironmentDetailsOnlyWhenExpanded]="true"
      (scenarioChanged)="reloadExecution()"
    />
  </div>
</mxevolve-business-process-content-container>
