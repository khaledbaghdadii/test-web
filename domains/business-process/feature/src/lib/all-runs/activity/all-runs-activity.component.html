<div class="w-full flex flex-col gap-4">
  <div class="all-runs-activity__toolbar flex items-center justify-between">
    <h2
      class="all-runs-activity__title text-xl font-bold leading-7 text-[#334155] m-0"
    >
      List of All Runs
    </h2>
    <mxevolve-my-runs-toggle
      [enabled]="true"
      (ownerPhrase)="onOwnerPhrase($event)"
    />
  </div>

  <mxevolve-activity-runs-table
    [projectId]="projectId()"
    [columnDefs]="activeColumnDefs()"
    [statuses]="activeStatuses"
    [pageSize]="5"
    [ownerPhrase]="ownerPhrase()"
    [loadPage]="loadPage()"
    [actionsColumn]="activeActionsColumn"
    noRowsMessage="No active runs"
  >
    <div
      activityRunsTableHeader
      class="text-xl font-bold leading-7 text-[#334155]"
    >
      Active Runs
    </div>
  </mxevolve-activity-runs-table>

  <div class="all-runs-activity__history-toggle flex">
    <p-button
      [text]="true"
      styleClass="inline-flex h-8 px-3 py-2 items-center gap-2"
      [label]="historyShown() ? 'Hide History' : 'Show History'"
      (onClick)="toggleHistory()"
    >
      <ng-template #icon>
        <mxevolve-icon
          [name]="historyShown() ? 'expand_less' : 'expand_more'"
          size="sm"
        />
      </ng-template>
    </p-button>
  </div>

  @if (historyShown()) {
  <mxevolve-activity-runs-table
    [projectId]="projectId()"
    [columnDefs]="historyColumnDefs()"
    [statuses]="historyStatuses"
    [pageSize]="10"
    [ownerPhrase]="ownerPhrase()"
    [loadPage]="loadPage()"
    [actionsColumn]="historyActionsColumn"
    noRowsMessage="No history"
  >
    <div
      activityRunsTableHeader
      class="text-xl font-bold leading-7 text-[#334155]"
    >
      Inactive Runs
    </div>
  </mxevolve-activity-runs-table>
  }
</div>
