@if (loading()) {
<!-- BC 4.8: loading skeleton — 3 stages -->
<div class="flex-1 flex flex-col gap-y-4 w-full animate-pulse">
  <div class="h-24 bg-surface-200 dark:bg-surface-700 rounded"></div>
  <div class="flex gap-4">
    @for (i of [1, 2, 3]; track i) {
    <div class="h-16 flex-1 bg-surface-200 dark:bg-surface-700 rounded"></div>
    }
  </div>
  <div class="flex-1 bg-surface-200 dark:bg-surface-700 rounded"></div>
</div>
} @else {
<div class="flex-1 flex flex-col min-h-0">
  <div class="flex-1 flex flex-col gap-y-[16px] w-full">
    <!-- BC S3: run header -->
    <mxevolve-validation-process-execution-run-header
      [execution]="executionDetails.value()!"
    />

    <!-- BC 4.6: expiry/end/error/aborted alert display -->
    <mxevolve-execution-alert-display
      [expiryDate]="executionDetails.value()!.expiryDate"
      [endDate]="executionDetails.value()!.endDate"
      [errorMessage]="executionDetails.value()!.errorMessage"
      [aborted]="executionDetails.value()!.status === ExecutionStatus.ABORTED"
    />

    @if (executionReadyForDisplay() || failedInBranchCreation()) {
    <!-- Stepper with 3 MV stages in DC-3 order -->
    <div class="flex-1 flex flex-col w-full">
      <mxevolve-stepper [steps]="steps()" [(displayedStepId)]="selectedStepId">
        <mxevolve-step stepId="run-quality-gate">
          <ng-template>
            <mxevolve-validation-process-execute-quality-gates-stage
              [stage]="executionDetails.value()!.executeQualityGatesStage"
              [projectId]="projectId()"
              [processId]="executionId()"
              [processName]="executionDetails.value()!.name"
              [developmentId]="
                executionDetails.value()!.createBranchStage.developmentId
              "
              [finalProductId]="executionDetails.value()!.input.finalProductId"
              [branch]="executionDetails.value()!.input.archivalBranchName"
            />
          </ng-template>
        </mxevolve-step>

        <mxevolve-step stepId="tag">
          <ng-template>
            <mxevolve-validation-process-tag-archival-stage
              [execution]="executionDetails.value()!"
            />
          </ng-template>
        </mxevolve-step>

        <mxevolve-step stepId="merge">
          <ng-template>
            <mxevolve-validation-process-integrate-fixes-stage
              [execution]="executionDetails.value()!"
            />
          </ng-template>
        </mxevolve-step>
      </mxevolve-stepper>
    </div>
    } @else {
    <!-- BC 4.5: waiting screen — branch being created -->
    <div class="flex-1 w-full flex flex-col items-center gap-[8px]">
      <mxevolve-illustration
        name="designing_architecture_in_metaverse"
        size="xxl"
      />
      <span class="text-3xl font-bold">Your branch is being created</span>
      <span class="text-xl font-medium">Refresh your page in a bit!</span>
    </div>
    }
  </div>
</div>
}
