<mxevolve-definition-input
  inputId="validation-repository"
  inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
  [forceShow]="notProvided('repositoryId')"
  [control]="repositoryIdFormControl()"
  label="Repository"
  description="Select the Repository where the configuration is stored"
>
  <mxevolve-repository-selector
    inputId="validation-repository"
    [projectId]="projectId()"
    [formControl]="repositoryIdFormControl()"
    (repositoryChanged)="onRepositoryChanged()"
    (failureEvent)="showSelectorError($event)"
  />
</mxevolve-definition-input>
@if (businessProcessQualityLevelFormControl().enabled) {
<mxevolve-definition-input
  inputId="validation-bp-quality-level"
  inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
  [forceShow]="notProvided('businessProcessQualityLevel')"
  [control]="businessProcessQualityLevelFormControl()"
  label="Business Process Quality Level"
  description="Select the business process quality level"
>
  <p-select
    inputId="validation-bp-quality-level"
    appendTo="body"
    styleClass="w-full"
    [options]="qualityLevelOptions"
    optionLabel="label"
    optionValue="value"
    [showClear]="true"
    [formControl]="businessProcessQualityLevelFormControl()"
    placeholder="Select Quality Gate Level"
  />
</mxevolve-definition-input>
} @if (businessProcessQualityLevelFormControl().value === "MQG") {
<mxevolve-validation-mqg-parameters
  [providedInputs]="providedInputs()"
  [projectId]="projectId()"
  [repositoryId]="repositoryIdFormControl().value ?? ''"
  [createBranchFormControl]="createBranchFormControl()"
  [parentBranchNameFormControl]="parentBranchNameFormControl()"
  [archivalBranchNameFormControl]="archivalBranchNameFormControl()"
  [finalProductIdFormControl]="finalProductIdFormControl()"
  [configCommitIdFormControl]="configCommitIdFormControl()"
  [rtpCommitIdFormControl]="rtpCommitIdFormControl()"
  [preselectedFinalProductId]="preselectedFinalProductId()"
/>
} @else if (businessProcessQualityLevelFormControl().value === "DQG") {
<mxevolve-validation-dqg-parameters
  [providedInputs]="providedInputs()"
  [projectId]="projectId()"
  [repositoryId]="repositoryIdFormControl().value ?? ''"
  [createBranchFormControl]="createBranchFormControl()"
  [archivalBranchNameFormControl]="archivalBranchNameFormControl()"
  [finalProductIdFormControl]="finalProductIdFormControl()"
  [configCommitIdFormControl]="configCommitIdFormControl()"
  [rtpCommitIdFormControl]="rtpCommitIdFormControl()"
  [preselectedFinalProductId]="preselectedFinalProductId()"
/>
}
