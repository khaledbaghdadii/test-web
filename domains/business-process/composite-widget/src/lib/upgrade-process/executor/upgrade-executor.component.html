<div class="flex flex-col gap-4 overflow-x-auto">
  @if (submitError(); as error) {
  <mxevolve-error-alert [message]="error" [closable]="false" />
  }
  <section class="border border-surface rounded-md overflow-hidden">
    <button
      type="button"
      class="flex w-full items-center justify-between gap-2 border-none cursor-pointer text-left px-4 py-3 bg-surface-100 dark:bg-surface-800 hover:bg-surface-200 dark:hover:bg-surface-700"
      [attr.aria-expanded]="detailsExpanded()"
      (click)="toggleDetails()"
    >
      <span class="font-semibold">{{ detailsTitle() }}</span>
      <mxevolve-icon
        [name]="detailsExpanded() ? 'expand_less' : 'expand_more'"
        size="sm"
      />
    </button>
    @if (detailsExpanded()) {
    <div
      class="border-t border-surface px-4 py-3 bg-surface-100 dark:bg-surface-800"
    >
      <mxevolve-upgrade-prefilled-inputs
        [projectId]="projectId()"
        [providedInputs]="prefilledInputs()"
      />
    </div>
    }
  </section>

  <form class="flex flex-col gap-6" [formGroup]="form()" (ngSubmit)="build()">
    <p class="mandatory-legend text-sm text-red-500 m-0">* Mandatory Field</p>

        <mxevolve-definition-input-group
      label="Official Status"
      [controls]="[
        form().controls.official
      ]"
      inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
      [forceShow]="notProvided('official')"
      [required]="form().controls.official.hasValidator(Validators.required)"
    >
      <div class="flex flex-row gap-4 mt-2">
        <div class="flex flex-row items-center gap-1">
          <p-radioButton
            inputId="upgrade-official"
            formControlName="official"
            [value]="true"
          />
          <label for="upgrade-official">Official Execution</label>
        </div>
        <div class="flex flex-row items-center gap-1">
          <p-radioButton
            inputId="upgrade-unofficial"
            formControlName="official"
            [value]="false"
          />
          <label for="upgrade-unofficial">Unofficial Execution</label>
        </div>
      </div>
    </mxevolve-definition-input-group>
        <div class="grid-2">
            <mxevolve-definition-input
        inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
        [forceShow]="notProvided('name')"
        inputId="upgrade-execution-name"
        [control]="form().controls.name"
        label="Execution Name"
      >
        <input
          id="upgrade-execution-name"
          pInputText
          class="w-full"
          formControlName="name"
          placeholder="Enter an upgrade process execution name"
        />
      </mxevolve-definition-input>
    </div>
        <mxevolve-definition-input-group
      label="MX Parameters"
      [controls]="[
        form().controls.factoryProduct,
        form().controls.parentMxArchivalBranch,
        form().controls.upgradeJump
      ]"
      inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
      [forceShow]="notProvided('factoryProduct') || notProvided('parentMxArchivalBranch') || notProvided('upgradeJump')"
    >
      <div class="grid-2">
                        <mxevolve-definition-input
          inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
          [forceShow]="notProvided('factoryProduct')"
          inputId="upgrade-conversion-factory-product"
          [control]="form().controls.factoryProduct"
          description="Select the factory product that you wish to validate your Quality Gate against"
          fieldClass="col-span-full"
        >
          <div
            mxevolveFactoryProductSelection
            class="grid-2"
            [projectId]="projectId()"
            [factoryProductId]="factoryProductId(form().controls.factoryProduct)"
            [initialMxVersion]="initialMxVersion(form().controls.factoryProduct)"
            [initialMxBuildId]="initialMxBuildId(form().controls.factoryProduct)"
            [initialBipVersion]="initialBipVersion(form().controls.factoryProduct)"
            [initialBipBuildId]="initialBipBuildId(form().controls.factoryProduct)"
            (factoryProductIdChange)="
              patchFactoryProduct(form().controls.factoryProduct, { id: $event ?? '' })
            "
            (mxVersionChange)="
              patchFactoryProduct(form().controls.factoryProduct, {
                mxVersion: $event?.version ?? ''
              })
            "
            (mxBuildIdChange)="
              patchFactoryProduct(form().controls.factoryProduct, {
                mxBuildId: $event?.buildId ?? ''
              })
            "
            (bipVersionChange)="
              patchFactoryProduct(form().controls.factoryProduct, {
                bipVersion: $event?.version
              })
            "
            (bipBuildIdChange)="
              patchFactoryProduct(form().controls.factoryProduct, {
                bipBuildId: $event?.buildId
              })
            "
          >
            <div class="field flex flex-col gap-2">
              <label for="upgrade-conversion-factory-product-mx-version" class="required">MX Version</label>
              <mxevolve-mx-version-dropdown inputId="upgrade-conversion-factory-product-mx-version" />
            </div>
            <div class="field flex flex-col gap-2">
              <label for="upgrade-conversion-factory-product-mx-build-id" class="required"
                >MX Build ID</label
              >
              <mxevolve-mx-build-id-dropdown inputId="upgrade-conversion-factory-product-mx-build-id" />
            </div>
            <div class="field flex flex-col gap-2">
              <label for="upgrade-conversion-factory-product-bip-version" class="required">BIP Version</label>
              <mxevolve-bip-version-dropdown inputId="upgrade-conversion-factory-product-bip-version" />
            </div>
            <div class="field flex flex-col gap-2">
              <label for="upgrade-conversion-factory-product-bip-build-id" class="required">BIP Build ID</label>
              <mxevolve-bip-build-id-dropdown inputId="upgrade-conversion-factory-product-bip-build-id" />
            </div>
          </div>
        </mxevolve-definition-input>
                        <mxevolve-definition-input
          inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
          [forceShow]="notProvided('parentMxArchivalBranch')"
          inputId="upgrade-parent-mx-archival-branch"
          [control]="form().controls.parentMxArchivalBranch"
          label="Parent MX Archival Branch"
          description="Enter the MX Archival Branch from where the selected MX Version was branched"
        >
          <input
            id="upgrade-parent-mx-archival-branch"
            pInputText
            class="w-full"
            formControlName="parentMxArchivalBranch"
            placeholder="Enter Parent MX Archival Branch"
          />
        </mxevolve-definition-input>
                        <mxevolve-definition-input
          inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
          [forceShow]="notProvided('upgradeJump')"
          inputId="upgrade-jump"
          [control]="form().controls.upgradeJump"
          label="Upgrade Jump"
          description="Select the type of jump you want to launch"
        >
          <p-select
            inputId="upgrade-jump"
            appendTo="body"
            styleClass="w-full"
            [options]="upgradeJumpOptions"
            optionLabel="label"
            optionValue="value"
            [showClear]="true"
            formControlName="upgradeJump"
            placeholder="Select an upgrade jump"
          />
        </mxevolve-definition-input>
      </div>
    </mxevolve-definition-input-group>
        <mxevolve-definition-input-group
      label="Configuration Parameters"
      [controls]="[
        form().controls.businessProcessQualityLevel,
        form().controls.repositoryId,
        form().controls.createBranch,
        form().controls.configurationBranchName,
        form().controls.configurationParentBranch
      ]"
      inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
      [forceShow]="notProvided('businessProcessQualityLevel') || notProvided('repositoryId') || notProvided('createBranch') || notProvided('configurationBranchName') || notProvided('configurationParentBranch')"
    >
      <div class="grid-2">
                <mxevolve-definition-input
          inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
          [forceShow]="notProvided('businessProcessQualityLevel')"
          inputId="upgrade-bp-quality-level"
          [control]="form().controls.businessProcessQualityLevel"
          label="Business Process Quality Level"
          description="Select the business process quality level"
        >
          <p-select
            inputId="upgrade-bp-quality-level"
            appendTo="body"
            styleClass="w-full"
            [options]="qualityLevelOptions"
            optionLabel="label"
            optionValue="value"
            [showClear]="true"
            formControlName="businessProcessQualityLevel"
            placeholder="Select Quality Gate Level"
          />
        </mxevolve-definition-input>
        <mxevolve-definition-input
          inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
          [forceShow]="notProvided('repositoryId')"
          inputId="upgrade-repository"
          [control]="form().controls.repositoryId"
          label="Repository"
          description="Select the Repository where the configuration is stored"
        >
          <mxevolve-repository-selector
            [projectId]="projectId()"
            inputId="upgrade-repository"
            [formControl]="form().controls.repositoryId"
            (repositoryChanged)="onRepositoryChanged()"
            (failureEvent)="showSelectorError($event)"
          />
        </mxevolve-definition-input>
        @if (form().controls.repositoryId.value) {
        <mxevolve-definition-input
          inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
          [forceShow]="notProvided('createBranch')"
          inputId="upgrade-create-branch"
          [control]="form().controls.createBranch"
          label="Create Branch?"
        >
          <div class="flex flex-row gap-4 mt-1">
            <div class="flex flex-row items-center gap-1">
              <p-radioButton
                inputId="upgrade-create-branch-yes"
                formControlName="createBranch"
                [value]="true"
              />
              <label for="upgrade-create-branch-yes">Yes</label>
            </div>
            <div class="flex flex-row items-center gap-1">
              <p-radioButton
                inputId="upgrade-create-branch-no"
                formControlName="createBranch"
                [value]="false"
              />
              <label for="upgrade-create-branch-no">No</label>
            </div>
          </div>
        </mxevolve-definition-input>
        @if (form().controls.createBranch.value !== null) {
        <mxevolve-definition-input
          inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
          [forceShow]="notProvided('configurationBranchName')"
          inputId="upgrade-config-branch"
          [control]="form().controls.configurationBranchName"
          label="Configuration Branch Name"
          description="Enter the Configuration Branch Name that you wish to use"
          [showValidationErrors]="false"
        >
          <mxevolve-branch-input
            [projectId]="projectId()"
            [repositoryId]="form().controls.repositoryId.value ?? ''"
            [branchShouldExist]="form().controls.createBranch.value !== true"
            inputId="upgrade-config-branch"
            [branchNameFormControl]="form().controls.configurationBranchName"
            [initialValue]="form().controls.configurationBranchName.value ?? ''"
            (initialInvalid)="showConfigBranchError()"
          />
        </mxevolve-definition-input>
        }
        @if (form().controls.createBranch.value !== null) {
        <mxevolve-definition-input
          inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
          [forceShow]="notProvided('configurationParentBranch')"
          inputId="upgrade-config-parent-branch"
          [control]="form().controls.configurationParentBranch"
          label="Configuration Parent Branch"
          description="Enter the Parent Branch from where you want to create your branch"
          [showValidationErrors]="false"
        >
          <mxevolve-branch-input
            [projectId]="projectId()"
            [repositoryId]="form().controls.repositoryId.value ?? ''"
            [branchShouldExist]="true"
            inputId="upgrade-config-parent-branch"
            [branchNameFormControl]="form().controls.configurationParentBranch"
            [initialValue]="
              form().controls.configurationParentBranch.value ?? ''
            "
            (initialInvalid)="showParentBranchError()"
          />
        </mxevolve-definition-input>
        }
        }
      </div>
    </mxevolve-definition-input-group>
    <mxevolve-definition-input-group
      label="Infrastructure Parameters"
      [controls]="[
        form().controls.qualityGateExecutionInfraGroupId,
        form().controls.binaryConversionInfraGroupId
      ]"
      inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
      [forceShow]="notProvided('qualityGateExecutionInfraGroupId') || notProvided('binaryConversionInfraGroupId')"
    >
      <div class="grid-2">
                        <mxevolve-definition-input
          inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
          [forceShow]="notProvided('qualityGateExecutionInfraGroupId')"
          inputId="upgrade-quality-gate-infra-group"
          [control]="form().controls.qualityGateExecutionInfraGroupId"
          label="Quality Gate Execution Infra Group"
          description="Select the Infra Group for the test(s) under &quot;Execute Quality Gate&quot; step"
        >
          <mxevolve-business-process-infra-group-selector
            [projectId]="projectId()"
            infraGroupFormControlName="upgrade-quality-gate-infra-group"
            [infraGroupFormControl]="
              form().controls.qualityGateExecutionInfraGroupId
            "
          />
        </mxevolve-definition-input>
                        <mxevolve-definition-input
          inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
          [forceShow]="notProvided('binaryConversionInfraGroupId')"
          inputId="upgrade-binary-conversion-infra-group"
          [control]="form().controls.binaryConversionInfraGroupId"
          label="Binary Conversion Infra Group"
          description="Select the Infra Group for the test under &quot;Convert Binary&quot; step"
        >
          <mxevolve-business-process-infra-group-selector
            [projectId]="projectId()"
            infraGroupFormControlName="upgrade-binary-conversion-infra-group"
            [infraGroupFormControl]="
              form().controls.binaryConversionInfraGroupId
            "
          />
        </mxevolve-definition-input>
      </div>
    </mxevolve-definition-input-group>
        <mxevolve-definition-input-group
      label="Tests"
      [controls]="[
        form().controls.testScenarioIds,
        form().controls.technicalUpgradeTestScenarioId
      ]"
      inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
      [forceShow]="notProvided('testScenarioIds') || notProvided('technicalUpgradeTestScenarioId')"
    >
      <div class="grid-2">
                        <mxevolve-definition-input
          inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
          [forceShow]="notProvided('testScenarioIds')"
          inputId="upgrade-quality-gate-test-scenarios"
          [control]="form().controls.testScenarioIds"
          label="Quality Gate Execution Test Scenarios"
          description="Select the collection of test scenarios that you wish to launch in the &quot;Execute Quality Gate&quot; step"
        >
          <mxevolve-scenario-definition-multiselect-dropdown
            [projectId]="projectId()"
            inputId="upgrade-quality-gate-test-scenarios"
            [formControl]="form().controls.testScenarioIds"
            (failureEvent)="showSelectorError($event)"
          />
        </mxevolve-definition-input>
                        <mxevolve-definition-input
          inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
          [forceShow]="notProvided('technicalUpgradeTestScenarioId')"
          inputId="upgrade-binary-conversion-scenario"
          [control]="form().controls.technicalUpgradeTestScenarioId"
          label="Binary Conversion Test Scenario"
          description="Select the test scenario that you wish to launch in the &quot;Convert Binary&quot; step"
        >
          <mxevolve-scenario-definition-dropdown
            [projectId]="projectId()"
            inputId="upgrade-binary-conversion-scenario"
            [formControl]="form().controls.technicalUpgradeTestScenarioId"
            (failureEvent)="showSelectorError($event)"
          />
        </mxevolve-definition-input>
      </div>
    </mxevolve-definition-input-group>
        <mxevolve-definition-input-group
      label="Reference Environment Parameters"
      [controls]="[
        form().controls.referenceCommitId,
        form().controls.referenceEnvironmentDefinitionId,
        form().controls.referenceFactoryProduct,
        form().controls.referenceEnvironmentInfraGroupId
      ]"
      inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
      [forceShow]="notProvided('referenceCommitId') || notProvided('referenceEnvironmentDefinitionId') || notProvided('referenceFactoryProduct') || notProvided('referenceEnvironmentInfraGroupId')"
    >
      <div class="grid-2">
                        <mxevolve-definition-input
          inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
          [forceShow]="notProvided('referenceCommitId')"
          inputId="upgrade-reference-commit"
          [control]="form().controls.referenceCommitId"
          label="Reference Commit ID"
          description="Select the commit ID of the reference environment"
        >
          <input
            id="upgrade-reference-commit"
            pInputText
            class="w-full"
            formControlName="referenceCommitId"
            placeholder="Enter Reference Commit ID"
          />
        </mxevolve-definition-input>
                        <mxevolve-definition-input
          inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
          [forceShow]="notProvided('referenceEnvironmentDefinitionId')"
          inputId="upgrade-reference-env-definition"
          [control]="form().controls.referenceEnvironmentDefinitionId"
          label="Reference Environment Definition"
          description="Select the environment definition for the reference environment"
        >
          <mxevolve-environment-definition-selector
            [projectId]="projectId()"
            inputId="upgrade-reference-env-definition"
            [formControl]="form().controls.referenceEnvironmentDefinitionId"
            (failureEvent)="showSelectorError($event)"
          />
        </mxevolve-definition-input>
                        <mxevolve-definition-input
          inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
          [forceShow]="notProvided('referenceFactoryProduct')"
          inputId="upgrade-reference-factory-product"
          [control]="form().controls.referenceFactoryProduct"
          description="Select the factory product that you wish to use in your reference environment"
          fieldClass="col-span-full"
        >
          <div
            mxevolveFactoryProductSelection
            class="grid-2"
            [projectId]="projectId()"
            [factoryProductId]="factoryProductId(form().controls.referenceFactoryProduct)"
            [initialMxVersion]="initialMxVersion(form().controls.referenceFactoryProduct)"
            [initialMxBuildId]="initialMxBuildId(form().controls.referenceFactoryProduct)"
            [initialBipVersion]="initialBipVersion(form().controls.referenceFactoryProduct)"
            [initialBipBuildId]="initialBipBuildId(form().controls.referenceFactoryProduct)"
            (factoryProductIdChange)="
              patchFactoryProduct(form().controls.referenceFactoryProduct, { id: $event ?? '' })
            "
            (mxVersionChange)="
              patchFactoryProduct(form().controls.referenceFactoryProduct, {
                mxVersion: $event?.version ?? ''
              })
            "
            (mxBuildIdChange)="
              patchFactoryProduct(form().controls.referenceFactoryProduct, {
                mxBuildId: $event?.buildId ?? ''
              })
            "
            (bipVersionChange)="
              patchFactoryProduct(form().controls.referenceFactoryProduct, {
                bipVersion: $event?.version
              })
            "
            (bipBuildIdChange)="
              patchFactoryProduct(form().controls.referenceFactoryProduct, {
                bipBuildId: $event?.buildId
              })
            "
          >
            <div class="field flex flex-col gap-2">
              <label for="upgrade-reference-factory-product-mx-version" class="required">MX Version</label>
              <mxevolve-mx-version-dropdown inputId="upgrade-reference-factory-product-mx-version" />
            </div>
            <div class="field flex flex-col gap-2">
              <label for="upgrade-reference-factory-product-mx-build-id" class="required"
                >MX Build ID</label
              >
              <mxevolve-mx-build-id-dropdown inputId="upgrade-reference-factory-product-mx-build-id" />
            </div>
            <div class="field flex flex-col gap-2">
              <label for="upgrade-reference-factory-product-bip-version" class="required">BIP Version</label>
              <mxevolve-bip-version-dropdown inputId="upgrade-reference-factory-product-bip-version" />
            </div>
            <div class="field flex flex-col gap-2">
              <label for="upgrade-reference-factory-product-bip-build-id" class="required">BIP Build ID</label>
              <mxevolve-bip-build-id-dropdown inputId="upgrade-reference-factory-product-bip-build-id" />
            </div>
          </div>
        </mxevolve-definition-input>
                        <mxevolve-definition-input
          inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
          [forceShow]="notProvided('referenceEnvironmentInfraGroupId')"
          inputId="upgrade-reference-environment-infra-group"
          [control]="form().controls.referenceEnvironmentInfraGroupId"
          label="Reference Environment Infra Group"
          description="Select the Infra Group for the reference environment"
        >
          <mxevolve-business-process-infra-group-selector
            [projectId]="projectId()"
            infraGroupFormControlName="upgrade-reference-environment-infra-group"
            [infraGroupFormControl]="
              form().controls.referenceEnvironmentInfraGroupId
            "
          />
        </mxevolve-definition-input>
      </div>
    </mxevolve-definition-input-group>
        <mxevolve-definition-input-group
      label="Notifications"
      [controls]="[
        form().controls.notificationsRecipients
      ]"
      inputAccessMode="ACCESS_EMPTY_OPTIONAL_INPUTS"
      [forceShow]="notProvided('notificationsRecipients')"
    >
      <div class="grid-2">
                <mxevolve-definition-input
          inputAccessMode="ACCESS_EMPTY_OPTIONAL_INPUTS"
          [forceShow]="notProvided('notificationsRecipients')"
          inputId="upgrade-notification-recipients"
          [control]="form().controls.notificationsRecipients"
          label="Expiry Date Notification Recipients"
          description="Select the users who will receive email notifications as the business process approaches its expiry date"
        >
          <mxevolve-notifications-recipients-input
            [projectId]="projectId()"
            inputId="upgrade-notification-recipients"
            [notificationsRecipientsFormControl]="
              form().controls.notificationsRecipients
            "
          />
        </mxevolve-definition-input>
      </div>
    </mxevolve-definition-input-group>

    <div class="actions grid-6">
      <p-button
        type="submit"
        label="Build"
        class="col-start-3 col-span-2"
        styleClass="w-full justify-center"
        [disabled]="
          form().invalid || form().pending || executing()
        "
        [loading]="executing()"
      />
      <p-button
        type="button"
        label="Cancel"
        class="col-span-2"
        styleClass="w-full justify-center"
        [outlined]="true"
        [disabled]="executing()"
        (onClick)="cancelled.emit()"
      />
    </div>
  </form>
</div>
