<div class="flex flex-col gap-4 overflow-x-auto">
  <section class="border border-surface rounded-md overflow-hidden">
    <button
      type="button"
      class="flex w-full items-center justify-between gap-2 border-none cursor-pointer text-left px-4 py-3 bg-surface-100 dark:bg-surface-800 hover:bg-surface-200 dark:hover:bg-surface-700"
      [attr.aria-expanded]="detailsExpanded()"
      (click)="toggleDetails()"
    >
      <span class="font-semibold">{{ detailsTitle() }}</span>
      <mxevolve-icon
        [name]="detailsExpanded() ? 'expand_less' : 'expand_more'"
        size="sm"
      />
    </button>
    @if (detailsExpanded()) {
    <div
      class="border-t border-surface px-4 py-3 bg-surface-100 dark:bg-surface-800"
    >
      <mxevolve-build-and-test-prefilled-inputs
        [projectId]="projectId()"
        [providedInputs]="prefilledInputs()"
      />
    </div>
    }
  </section>

  <form class="flex flex-col gap-6" [formGroup]="form()" (ngSubmit)="build()">
    <p class="mandatory-legend text-sm text-red-500 m-0">* Mandatory Field</p>

    <div class="grid-2">
      <mxevolve-definition-input
        inputId="bt-execution-name"
        [forceShow]="notProvided('name')"
        [control]="form().controls.name"
        inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
        label="Execution Name"
      >
        <input
          id="bt-execution-name"
          pInputText
          class="w-full"
          formControlName="name"
          placeholder="Enter a build and test process execution name"
        />
      </mxevolve-definition-input>
    </div>
    <mxevolve-definition-input-group
      label="Configuration Parameters"
      [controls]="[
        form().controls.repositoryId,
        form().controls.configurationBranchName,
        form().controls.configurationParentBranch
      ]"
      inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
      [forceShow]="notProvided('repositoryId') || notProvided('configurationBranchName') || notProvided('configurationParentBranch')"
    >
      <div class="grid-2">
        <mxevolve-definition-input
          inputId="bt-repository"
          [forceShow]="notProvided('repositoryId')"
          [control]="form().controls.repositoryId"
          inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
          label="Repository"
          description="Select the Repository where the configuration is stored"
        >
          <mxevolve-repository-selector
            [projectId]="projectId()"
            inputId="bt-repository"
            [formControl]="form().controls.repositoryId"
            (repositoryChanged)="onRepositoryChanged()"
            (failureEvent)="showSelectorError($event)"
          />
        </mxevolve-definition-input>
        @if (form().controls.repositoryId.value) {
        <mxevolve-definition-input
          inputId="bt-config-branch"
          [forceShow]="notProvided('configurationBranchName')"
          [control]="form().controls.configurationBranchName"
          inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
          label="Configuration Branch Name"
          description="Enter the Configuration Branch Name that you wish to use"
          [showValidationErrors]="false"
        >
          <mxevolve-branch-input
            [projectId]="projectId()"
            [repositoryId]="form().controls.repositoryId.value ?? ''"
            [branchShouldExist]="false"
            inputId="bt-config-branch"
            [branchNameFormControl]="form().controls.configurationBranchName"
            [initialValue]="form().controls.configurationBranchName.value ?? ''"
            (initialInvalid)="showConfigBranchError()"
          />
        </mxevolve-definition-input>
        } @if (form().controls.repositoryId.value) {
        <mxevolve-definition-input
          inputId="bt-config-parent-branch"
          [forceShow]="notProvided('configurationParentBranch')"
          [control]="form().controls.configurationParentBranch"
          inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
          label="Configuration Parent Branch"
          description="Enter the Parent Branch from where you want to create your branch"
          [showValidationErrors]="false"
        >
          <mxevolve-branch-input
            [projectId]="projectId()"
            [repositoryId]="form().controls.repositoryId.value ?? ''"
            [branchShouldExist]="true"
            inputId="bt-config-parent-branch"
            [branchNameFormControl]="form().controls.configurationParentBranch"
            [initialValue]="
              form().controls.configurationParentBranch.value ?? ''
            "
            (initialInvalid)="showParentBranchError()"
          />
        </mxevolve-definition-input>
        }
      </div>
    </mxevolve-definition-input-group>

    <mxevolve-definition-input-group
      label="Build Scenario"
      [controls]="[form().controls.buildScenarioDefinitionId]"
      inputAccessMode="ACCESS_ALL_INPUTS"
    >
      <div class="grid-2">
        <div class="field flex flex-col gap-1 self-end">
          <span class="font-medium">Build Environment</span>
          <div class="flex items-center gap-2">
            <p-checkbox
              inputId="bt-skip-environment"
              [binary]="true"
              formControlName="skipEnvironmentDeployment"
              (onChange)="trackSkipEnvironmentDeployment()"
            />
            <label for="bt-skip-environment"
              >Skip "Prepare Build Environment" step</label
            >
          </div>
        </div>
        @if (!skipEnvironmentDeployment()) {
        <mxevolve-definition-input
          inputId="bt-build-scenario"
          [forceShow]="notProvided('buildScenarioDefinitionId')"
          [control]="form().controls.buildScenarioDefinitionId"
          inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
          label="Build Scenario"
        >
          <mxevolve-scenario-definition-dropdown
            [projectId]="projectId()"
            inputId="bt-build-scenario"
            [formControl]="form().controls.buildScenarioDefinitionId"
            (failureEvent)="showSelectorError($event)"
          />
        </mxevolve-definition-input>
        }
      </div>
    </mxevolve-definition-input-group>

    <mxevolve-definition-input-group
      label="User Stories"
      [controls]="[form().controls.userStoryIds]"
      inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
      [forceShow]="notProvided('userStoryIds')"
      [required]="
        form().controls.userStoryIds.hasValidator(Validators.required)
      "
    >
      <mxevolve-definition-input
        inputId="bt-user-story-ids"
        [forceShow]="notProvided('userStoryIds')"
        [control]="form().controls.userStoryIds"
        inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
        description="Enter the IDs of the stories you will be working on"
      >
        <mxevolve-user-story-input
          [projectId]="projectId()"
          [shouldValidate]="true"
          [formControl]="form().controls.userStoryIds"
        />
      </mxevolve-definition-input>
    </mxevolve-definition-input-group>
    <mxevolve-definition-input-group
      label="Infrastructure Parameters"
      [controls]="[
        form().controls.buildEnvironmentInfraGroup,
        form().controls.buildAndTestInfraGroup
      ]"
      inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
      [forceShow]="notProvided('buildEnvironmentInfraGroup') || notProvided('buildAndTestInfraGroup')"
    >
      <div class="grid-2">
        <mxevolve-definition-input
          inputId="bt-build-environment-infra-group"
          [forceShow]="notProvided('buildEnvironmentInfraGroup')"
          [control]="form().controls.buildEnvironmentInfraGroup"
          inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
          label="Build Environment Infra Group"
          description="Select the Infra Group for the build environment"
        >
          <mxevolve-business-process-infra-group-selector
            [projectId]="projectId()"
            infraGroupFormControlName="bt-build-environment-infra-group"
            [infraGroupFormControl]="form().controls.buildEnvironmentInfraGroup"
          />
        </mxevolve-definition-input>
        <mxevolve-definition-input
          inputId="bt-build-and-test-infra-group"
          [forceShow]="notProvided('buildAndTestInfraGroup')"
          [control]="form().controls.buildAndTestInfraGroup"
          inputAccessMode="ACCESS_INVALID_INPUTS_ONLY"
          label="Build and Test Infra Group"
          description='Select the Infra Group for the test(s) executed under "Build &amp; Test" step'
        >
          <mxevolve-business-process-infra-group-selector
            [projectId]="projectId()"
            infraGroupFormControlName="bt-build-and-test-infra-group"
            [infraGroupFormControl]="form().controls.buildAndTestInfraGroup"
          />
        </mxevolve-definition-input>
      </div>
    </mxevolve-definition-input-group>

    <mxevolve-definition-input-group
      label="Notifications"
      [controls]="[form().controls.notificationsRecipients]"
      inputAccessMode="ACCESS_EMPTY_OPTIONAL_INPUTS"
      [forceShow]="notProvided('notificationsRecipients')"
    >
      <div class="grid-2">
        <mxevolve-definition-input
          inputId="bt-notification-recipients"
          [forceShow]="notProvided('notificationsRecipients')"
          [control]="form().controls.notificationsRecipients"
          inputAccessMode="ACCESS_EMPTY_OPTIONAL_INPUTS"
          label="Expiry Date Notification Recipients"
          description="Select the users who will receive email notifications as the business process approaches its expiry date"
        >
          <mxevolve-notifications-recipients-input
            [projectId]="projectId()"
            inputId="bt-notification-recipients"
            [notificationsRecipientsFormControl]="
              form().controls.notificationsRecipients
            "
          />
        </mxevolve-definition-input>
      </div>
    </mxevolve-definition-input-group>

    <div class="actions grid-6">
      <p-button
        type="submit"
        label="Build"
        class="col-start-3 col-span-2"
        styleClass="w-full justify-center"
        [disabled]="form().invalid || form().pending || executing()"
        [loading]="executing()"
      />
    </div>
  </form>
</div>
