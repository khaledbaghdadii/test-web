@if (loading()) {
<mxevolve-skeleton [rows]="skeletonRows()" [columns]="skeletonColumns" />
} @else if (sections().length > 0) {
<div class="flex flex-col gap-6">
  @for (section of sections(); track section.title) {
  <section class="flex flex-col gap-3">
    <h4 class="text-primary font-bold m-0">{{ section.title }}</h4>
    <dl class="grid-2 m-0">
      @for (row of section.rows; track row.label) {
      <div class="flex flex-col gap-1">
        <dt class="text-sm text-color-secondary">{{ row.label }}</dt>
        <dd class="m-0 font-bold">
          {{ displayValue(row.value, row.displayValue) }}
        </dd>
      </div>
      }
    </dl>
  </section>
  }
</div>
}
