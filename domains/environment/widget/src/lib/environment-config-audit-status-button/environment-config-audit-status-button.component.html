@if (visible) {
<span class="inline-flex items-center">
  @if (showDropdown) {
  <p-splitbutton
    label="Config Audit"
    [icon]="icon"
    [text]="true"
    [model]="dropdownItems"
    [severity]="buttonSeverity"
    [disabled]="loading"
    [pTooltip]="tooltipMessage"
    [tooltipDisabled]="!tooltipMessage"
  ></p-splitbutton>
  } @else {
  <p-button
    label="Config Audit"
    [icon]="icon"
    [text]="true"
    [severity]="buttonSeverity"
    [loading]="loading"
    [pTooltip]="tooltipMessage"
    [tooltipDisabled]="!tooltipMessage"
  ></p-button>
  } @if (detailsMessage) {
  <mxevolve-icon
    name="info"
    size="sm"
    class="cursor-pointer ml-1"
    [color]="'#007bff'"
    [pTooltip]="'Click to see more details'"
    tooltipStyleClass="min-w-max"
    tooltipPosition="top"
    (click)="openDetailsDialog($event)"
    (keyup)="openDetailsDialog($event)"
  />
  }
</span>
<p-dialog
  header="Config Audit"
  [(visible)]="dialogVisible"
  [modal]="true"
  [closeOnEscape]="true"
  [dismissableMask]="true"
  [resizable]="false"
  [style]="{ width: '50rem' }"
>
  <p>{{ detailsMessage }}</p>
</p-dialog>
}
