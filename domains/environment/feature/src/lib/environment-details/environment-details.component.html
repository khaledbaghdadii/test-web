<p-toast position="top-right" />

<mxevolve-breadcrumb
  [resourceType]="'ENVIRONMENT'"
  [resourceId]="environmentId"
  [projectId]="projectId"
/>

@if (loading()) {
<div class="flex items-center justify-center p-8">
  <p-progressSpinner />
</div>
} @else if (hasError()) {
<div class="p-4 text-red-500">Failed to load environment.</div>
} @else if (environmentResource.value()) {
<mxevolve-environment-details-header
  [projectId]="projectId"
  [environment]="environmentResource.value()!"
  (changed)="reloadAll()"
  (panelError)="handlePanelError($event)"
></mxevolve-environment-details-header>
<mxevolve-environment-details-info
  [projectId]="projectId"
  [environment]="environmentResource.value()!"
  [latestRequest]="latestRequest()"
></mxevolve-environment-details-info>
<mxevolve-environment-actions-panel
  [projectId]="projectId"
  [environmentId]="environmentId"
  [requests]="requests()"
></mxevolve-environment-actions-panel>
<mxevolve-environment-resources-tabs
  [environment]="environmentResource.value()!"
></mxevolve-environment-resources-tabs>
}
