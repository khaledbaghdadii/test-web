<mxevolve-single-select-dropdown
  [stateProvider]="stateProvider"
  [dataParams]="{ projectId: projectId() }"
  [inputId]="inputId()"
  [config]="{
    placeholder: 'Select a repository',
    filter: true,
    disabled: disabled()
  }"
  (selectionChange)="onSelectionChange($event)"
  (errorEvent)="onError($event)"
/>
