<div>
  @if (showCommitsBehindWarning() && commitsBehindCount() > 0) {
  <p-message severity="warn" styleClass="mb-4 w-full">
    <ng-template #icon>
      <mxevolve-icon name="info" size="md" class="mr-2 mt-1" />
    </ng-template>
    You are <b>{{ commitsBehindCount() }}</b>
    {{ commitsBehindCount() === 1 ? "commit" : "commits" }} behind
    {{ development().source ?? "" }}.
  </p-message>
  }
  <div class="text-sm font-bold text-surface-900 dark:text-surface-0 mb-4">
    {{ displayTitle() }}
  </div>
  @if (isMergedWithPr()) {
  <ag-grid-angular
    class="w-full"
    [rowData]="prCommits()"
    [columnDefs]="colDefs"
    [defaultColDef]="defaultColDef"
    [noRowsOverlayComponent]="noRowsOverlayComponent"
    [noRowsOverlayComponentParams]="noRowsOverlayComponentParams"
    [loadingOverlayComponent]="loadingOverlayComponent"
    [loading]="prCommitsResource.isLoading()"
    domLayout="autoHeight"
  />
  } @else if (isDeleted()) {
  <ag-grid-angular
    class="w-full"
    [rowData]="[]"
    [columnDefs]="colDefs"
    [defaultColDef]="defaultColDef"
    [noRowsOverlayComponent]="noRowsOverlayComponent"
    [noRowsOverlayComponentParams]="noRowsOverlayComponentParams"
    domLayout="autoHeight"
  />
  } @else {
  <mxevolve-paginated-commits-difference
    [projectId]="development().projectId"
    [repositoryId]="development().repository.id"
    [source]="development().name"
    [destination]="development().source ?? ''"
    [noRowsMessage]="'No commits on this branch'"
  />
  }
</div>
